<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelHolo - AI Avatar Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* State 1: Upload */
        .upload-state {
            display: block;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-display {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 40px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
            min-height: 150px;
        }

        .file-input-display:hover {
            background: linear-gradient(135deg, #edf2f7, #e2e8f0);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .file-input-display i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .file-input-text {
            color: #4a5568;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .file-input-subtext {
            color: #718096;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .file-selected .file-input-display {
            background: linear-gradient(135deg, #e6fffa, #b2f5ea);
            border-color: #38b2ac;
        }

        .file-selected .file-input-display i {
            color: #38b2ac;
        }

        .upload-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            margin-top: 20px;
        }

        .upload-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #edf2f7;
            color: #4a5568;
            padding: 12px 20px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
            background: #f7fafc;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .saved-avatars-block {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }

        .saved-avatars-heading {
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .saved-avatars-hint {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 14px;
        }

        .saved-avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }

        .saved-avatar-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .saved-avatar-card:hover {
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .saved-avatar-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .saved-avatar-card .card-label {
            padding: 8px 6px 4px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2d3748;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-avatar-card .card-actions {
            display: flex;
            gap: 6px;
            padding: 6px 8px 10px;
            justify-content: center;
        }

        .btn-tiny {
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-load {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            flex: 1;
        }

        .btn-load:hover:not(:disabled) {
            opacity: 0.92;
        }

        .btn-delete {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .btn-delete:hover {
            background: #fed7d7;
        }

        .avatar-persist-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .avatar-persist-row input {
            flex: 1;
            min-width: 160px;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .avatar-persist-row input:focus {
            outline: none;
            border-color: #667eea;
        }

        .save-avatar-status {
            font-size: 0.85rem;
            color: #38a169;
            min-height: 1.2em;
        }

        .save-avatar-status.error {
            color: #c53030;
        }

        /* State 2: Loading */
        .loading-state {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #4a5568;
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* State 3: Chat */
        .chat-state {
            display: none;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            /* Default aspect ratio; overridden by JS once we know the source video size. */
            aspect-ratio: 16 / 9;
        }

        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
            opacity: 0;
            transition: opacity 80ms linear;
            pointer-events: none;
        }

        .video-player.is-front {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            opacity: 1;
            transition: opacity 120ms linear;
            z-index: 1;
            pointer-events: none;
        }

        .video-poster.hidden {
            opacity: 0;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .mic-btn {
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
        }
        
        .mic-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .mic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .mic-btn.recording {
            background: linear-gradient(135deg, #fc8181, #e53e3e);
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(252, 129, 129, 0.7);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(252, 129, 129, 0);
            }
        }

        #chatInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        #chatInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .thinking-indicator {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .thinking-indicator.active {
            display: block;
        }

        .error-message {
            display: none;
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c53030;
        }

        .error-message.active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .chat-input-container {
                flex-direction: column;
            }

            .send-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-robot"></i> PixelHolo</h1>
        <p class="subtitle">AI Avatar Chat Interface</p>

        <!-- State 1: Upload -->
        <div class="upload-state" id="uploadState">
            <div class="file-input-wrapper">
                <input type="file" id="videoInput" class="file-input" accept="video/*">
                <div class="file-input-display" id="fileDisplay">
                    <div>
                        <i class="fas fa-video"></i>
                        <div class="file-input-text">Click to upload your video</div>
                        <div class="file-input-subtext">MP4, AVI, MOV, or other video formats</div>
                    </div>
                </div>
            </div>
            <button class="upload-btn" id="uploadBtn" disabled>Upload Video</button>
            <div class="error-message" id="uploadError"></div>

            <div class="saved-avatars-block" id="savedAvatarsBlock">
                <h3 class="saved-avatars-heading">Saved avatars</h3>
                <p class="saved-avatars-hint" id="savedAvatarsEmpty">None yet. After you chat with an avatar, give it a name and save it below the video.</p>
                <div class="saved-avatar-grid" id="savedAvatarsGrid"></div>
            </div>
        </div>

        <!-- State 2: Loading -->
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <div class="loading-text">Initializing Avatar...</div>
        </div>

        <!-- State 3: Chat -->
        <div class="chat-state" id="chatState">
            <div class="video-container" id="videoContainer">
                <!-- Static poster shown while idle; hidden once a chunk starts playing. -->
                <img id="videoPoster" class="video-poster" alt="">
                <!-- Two stacked video players. We never re-assign src on the visible
                     element; instead we load the next chunk into the back player and
                     swap which one has the `is-front` class on chunk-end. This keeps
                     the visible video element fully buffered and avoids the ~500 ms
                     buffering UI that appears whenever a video element re-loads. -->
                <video id="videoPlayerA" class="video-player" preload="auto" playsinline></video>
                <video id="videoPlayerB" class="video-player" preload="auto" playsinline></video>
            </div>
            <div class="avatar-persist-row">
                <input type="text" id="saveAvatarNameInput" placeholder="Name this avatar to save…" maxlength="120" autocomplete="off">
                <button type="button" class="btn-secondary" id="saveAvatarBtn">Save avatar</button>
                <span class="save-avatar-status" id="saveAvatarStatus"></span>
            </div>
            <div class="chat-input-container">
                <button class="mic-btn" id="micBtn" title="Hold to record">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="chatInput" placeholder="Type your message here..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
            <div class="thinking-indicator" id="thinkingIndicator">
                <i class="fas fa-spinner fa-spin"></i> Thinking...
            </div>
            <div class="error-message" id="chatError"></div>
        </div>
    </div>

    <script>
        // State management
        let currentState = 'upload';
        let posterUrl = '';

        const uploadState = document.getElementById('uploadState');
        const loadingState = document.getElementById('loadingState');
        const chatState = document.getElementById('chatState');
        const videoInput = document.getElementById('videoInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const videoContainer = document.getElementById('videoContainer');
        const videoPoster = document.getElementById('videoPoster');
        const videoPlayerA = document.getElementById('videoPlayerA');
        const videoPlayerB = document.getElementById('videoPlayerB');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const thinkingIndicator = document.getElementById('thinkingIndicator');
        const uploadError = document.getElementById('uploadError');
        const chatError = document.getElementById('chatError');
        const savedAvatarsGrid = document.getElementById('savedAvatarsGrid');
        const savedAvatarsEmpty = document.getElementById('savedAvatarsEmpty');
        const saveAvatarNameInput = document.getElementById('saveAvatarNameInput');
        const saveAvatarBtn = document.getElementById('saveAvatarBtn');
        const saveAvatarStatus = document.getElementById('saveAvatarStatus');

        function showState(state) {
            uploadState.style.display = state === 'upload' ? 'block' : 'none';
            loadingState.style.display = state === 'loading' ? 'block' : 'none';
            chatState.style.display = state === 'chat' ? 'block' : 'none';
            currentState = state;
        }

        function applySessionReady(data) {
            posterUrl = data.poster_url;
            videoPoster.src = posterUrl;
            videoPoster.classList.remove('hidden');
            if (data.stt_available === false) {
                micBtn.disabled = true;
                micBtn.title = data.stt_error
                    ? `Voice input unavailable: ${data.stt_error}`
                    : 'Voice input unavailable on server';
            } else {
                micBtn.disabled = false;
                micBtn.title = 'Hold to record';
            }
            showState('chat');
        }

        async function refreshSavedAvatars() {
            if (!savedAvatarsGrid || !savedAvatarsEmpty) return;
            try {
                const response = await fetch('/avatars');
                const data = await response.json();
                const list = data.avatars || [];
                savedAvatarsGrid.innerHTML = '';
                if (list.length === 0) {
                    savedAvatarsEmpty.classList.remove('hidden');
                    return;
                }
                savedAvatarsEmpty.classList.add('hidden');
                for (const av of list) {
                    const card = document.createElement('div');
                    card.className = 'saved-avatar-card';
                    const img = document.createElement('img');
                    img.src = av.poster_url + '?t=' + Date.now();
                    img.alt = av.name || 'Avatar';
                    const label = document.createElement('div');
                    label.className = 'card-label';
                    label.textContent = av.name || av.id.slice(0, 8);
                    const actions = document.createElement('div');
                    actions.className = 'card-actions';
                    const loadBtn = document.createElement('button');
                    loadBtn.type = 'button';
                    loadBtn.className = 'btn-tiny btn-load';
                    loadBtn.textContent = 'Load';
                    loadBtn.addEventListener('click', () => loadSavedAvatar(av.id));
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'btn-tiny btn-delete';
                    delBtn.title = 'Delete saved avatar';
                    delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteSavedAvatar(av.id, av.name || av.id.slice(0, 8));
                    });
                    actions.appendChild(loadBtn);
                    actions.appendChild(delBtn);
                    card.appendChild(img);
                    card.appendChild(label);
                    card.appendChild(actions);
                    savedAvatarsGrid.appendChild(card);
                }
            } catch (err) {
                console.warn('Could not list saved avatars', err);
            }
        }

        async function loadSavedAvatar(avatarId) {
            uploadError.classList.remove('active');
            try {
                showState('loading');
                const response = await fetch('/avatars/load', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: avatarId }),
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Load failed');
                }
                applySessionReady(data);
            } catch (error) {
                showState('upload');
                showError(uploadError, error.message || 'Failed to load saved avatar.');
            }
        }

        async function deleteSavedAvatar(avatarId, displayName) {
            if (!confirm(`Delete saved avatar "${displayName}"? This cannot be undone.`)) {
                return;
            }
            try {
                const response = await fetch('/avatars/' + encodeURIComponent(avatarId), {
                    method: 'DELETE',
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Delete failed');
                }
                await refreshSavedAvatars();
            } catch (error) {
                showError(uploadError, error.message || 'Failed to delete avatar.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshSavedAvatars();
        });

        function showError(element, message) {
            element.textContent = message;
            element.classList.add('active');
            setTimeout(() => {
                element.classList.remove('active');
            }, 5000);
        }

        // File input handling
        videoInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const display = document.getElementById('fileDisplay');
                display.parentElement.classList.add('file-selected');
                display.innerHTML = `
                    <div>
                        <i class="fas fa-check-circle"></i>
                        <div class="file-input-text">${file.name}</div>
                        <div class="file-input-subtext">Ready to upload</div>
                    </div>
                `;
                uploadBtn.disabled = false;
            }
        });

        // Upload button handler
        uploadBtn.addEventListener('click', async function () {
            const file = videoInput.files[0];
            if (!file) {
                showError(uploadError, 'Please select a video file');
                return;
            }

            uploadBtn.disabled = true;
            uploadError.classList.remove('active');

            const formData = new FormData();
            formData.append('video', file);

            try {
                showState('loading');

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Upload failed');
                }

                applySessionReady(data);
                await refreshSavedAvatars();
            } catch (error) {
                showState('upload');
                showError(uploadError, error.message || 'Failed to upload video. Please try again.');
                uploadBtn.disabled = false;
            }
        });

        saveAvatarBtn.addEventListener('click', async function () {
            const name = (saveAvatarNameInput.value || '').trim();
            if (!name) {
                saveAvatarStatus.textContent = 'Enter a name first.';
                saveAvatarStatus.classList.add('error');
                setTimeout(() => {
                    saveAvatarStatus.textContent = '';
                    saveAvatarStatus.classList.remove('error');
                }, 4000);
                return;
            }
            saveAvatarBtn.disabled = true;
            saveAvatarStatus.textContent = '';
            saveAvatarStatus.classList.remove('error');
            try {
                const response = await fetch('/avatars/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name }),
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Save failed');
                }
                saveAvatarStatus.textContent = 'Saved.';
                await refreshSavedAvatars();
            } catch (error) {
                saveAvatarStatus.textContent = error.message || 'Save failed.';
                saveAvatarStatus.classList.add('error');
            } finally {
                saveAvatarBtn.disabled = false;
            }
        });

        // Send button handler
        sendBtn.addEventListener('click', handleSend);

        // Enter key handler
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                handleSend();
            }
        });
        
        // Microphone recording functionality
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let stream = null;
        
        async function requestMicrophonePermission() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                return true;
            } catch (error) {
                console.error('Microphone permission denied:', error);
                showError(chatError, 'Microphone access denied. Please allow microphone access to use voice input.');
                return false;
            }
        }
        
        function startRecording() {
            if (isRecording) return;
            
            audioChunks = [];
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.innerHTML = '<i class="fas fa-stop"></i>';
            
            const options = { mimeType: 'audio/webm' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'audio/webm;codecs=opus';
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options.mimeType = 'audio/webm';
                }
            }
            
            try {
                mediaRecorder = new MediaRecorder(stream, options);
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudioToServer(audioBlob);
                };
                
                mediaRecorder.start();
                console.log('Recording started');
            } catch (error) {
                console.error('Error starting recording:', error);
                stopRecording();
                showError(chatError, 'Failed to start recording. Please try again.');
            }
        }
        
        function stopRecording() {
            if (!isRecording) return;
            
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            // Stop all tracks
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            console.log('Recording stopped');
        }
        
        async function sendAudioToServer(audioBlob) {
            // Clean up any previous question's state
            cleanupPreviousQuestion();
            
            // Disable input and show thinking indicator
            chatInput.disabled = true;
            sendBtn.disabled = true;
            micBtn.disabled = true;
            thinkingIndicator.classList.add('active');
            chatError.classList.remove('active');
            
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                const response = await fetch('/chat_audio', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Audio processing failed');
                }
                
                // Show transcription in chat input (optional feedback)
                if (data.transcription) {
                    chatInput.value = data.transcription;
                    console.log('Transcription:', data.transcription);
                }
                
                // Open SSE stream for chunks (same as text input)
                if (data.pipeline_id) {
                    startEventStream(data.pipeline_id);
                } else {
                    throw new Error('No pipeline ID returned');
                }
                
            } catch (error) {
                console.error('Error sending audio:', error);
                showError(chatError, error.message || 'Failed to process audio. Please try again.');
                chatInput.disabled = false;
                sendBtn.disabled = false;
                micBtn.disabled = false;
                thinkingIndicator.classList.remove('active');
            }
        }
        
        // Microphone button handlers
        micBtn.addEventListener('mousedown', async (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
                return;
            }
            
            const hasPermission = await requestMicrophonePermission();
            if (hasPermission) {
                startRecording();
            }
        });
        
        micBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });
        
        micBtn.addEventListener('mouseleave', (e) => {
            // Stop recording if mouse leaves button while recording
            if (isRecording) {
                stopRecording();
            }
        });
        
        // Touch events for mobile
        micBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
                return;
            }
            
            const hasPermission = await requestMicrophonePermission();
            if (hasPermission) {
                startRecording();
            }
        });
        
        micBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });
        
        micBtn.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            }
        });

        // === Two-element opacity-swap player =================================
        //
        // We keep two <video> elements stacked in the same container. At any time
        // ONE of them is "front" (opacity 1, visible, currently playing) and the
        // other is "back" (opacity 0, preloading the next chunk). Crucially we
        // never re-assign `src` on the front element while it's visible -- doing
        // so triggers the browser's buffering UI for ~300-500 ms even if the file
        // is in HTTP cache. Instead, on the chunk-end event we just swap which
        // element has the `is-front` CSS class and call play() on the new front
        // (whose data is already fully loaded). The transition is essentially
        // instantaneous (~80 ms CSS opacity fade).

        const players = [videoPlayerA, videoPlayerB];
        let frontIdx = 0;
        let backIdx = 1;
        const playerLoaded = [false, false]; // back-element src has finished loading
        const playerSrc = ['', ''];           // current src per element (for de-dup)

        let videoQueue = [];
        let isPlayingQueue = false;
        let currentPipelineId = null;
        let eventSource = null;
        let firstVideoStarted = false;
        let aspectRatioSet = false;

        function frontPlayer() { return players[frontIdx]; }
        function backPlayer() { return players[backIdx]; }

        function setAspectRatioFromVideo(videoEl) {
            if (aspectRatioSet) return;
            if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
                videoContainer.style.aspectRatio = `${videoEl.videoWidth} / ${videoEl.videoHeight}`;
                aspectRatioSet = true;
            }
        }

        function loadIntoBack(url) {
            // Load `url` into the BACK player. Returns immediately; readiness is
            // tracked via the canplaythrough listener attached at startup.
            const idx = backIdx;
            const el = players[idx];
            const versioned = url + '?v=' + Date.now();
            if (playerSrc[idx] === versioned) return;
            playerLoaded[idx] = false;
            playerSrc[idx] = versioned;
            el.src = versioned;
            el.load();
        }

        function swapToBack() {
            // Promote the back player to front: make it visible and play.
            const newFront = players[backIdx];
            const oldFront = players[frontIdx];

            newFront.currentTime = 0;
            newFront.classList.add('is-front');
            const playPromise = newFront.play();
            if (playPromise) {
                playPromise.catch(err => console.warn('play() rejected:', err));
            }
            // Hide poster the first time a real video appears.
            videoPoster.classList.add('hidden');

            // Remove front-class from previous element after a tick so the fade
            // covers any single-frame discontinuity.
            requestAnimationFrame(() => {
                oldFront.classList.remove('is-front');
                oldFront.pause();
            });

            // Roles swap.
            const oldFrontIdx = frontIdx;
            frontIdx = backIdx;
            backIdx = oldFrontIdx;
            playerLoaded[oldFrontIdx] = false;
            playerSrc[oldFrontIdx] = '';
        }

        function startInitialPlayback(url) {
            // Special case for chunk 0: nothing is on screen yet, so we load into
            // the *front* element directly and play.
            const el = frontPlayer();
            const versioned = url + '?v=' + Date.now();
            playerSrc[frontIdx] = versioned;
            el.src = versioned;
            el.load();
            el.classList.add('is-front');
            const p = el.play();
            if (p) p.catch(err => console.warn('initial play() rejected:', err));
            videoPoster.classList.add('hidden');
        }

        function maybeStartNextChunk() {
            // Called whenever the queue or playback state changes. Decides whether
            // to start playback (if idle) or just preload (if already playing).
            if (videoQueue.length === 0) return;

            if (!isPlayingQueue) {
                const url = videoQueue.shift();
                isPlayingQueue = true;
                startInitialPlayback(url);
                // Eagerly load the next one if we have it.
                if (videoQueue.length > 0) {
                    loadIntoBack(videoQueue[0]);
                }
            } else {
                // Already playing front: keep the back player loaded with the next
                // queued chunk so the swap on `ended` is instant.
                if (!playerLoaded[backIdx] && videoQueue.length > 0) {
                    loadIntoBack(videoQueue[0]);
                }
            }
        }

        function onChunkEnded() {
            // Front chunk finished. Promote back if it has the next chunk loaded;
            // otherwise stay on the last frame and wait for more.
            if (videoQueue.length === 0 && currentPipelineId === null) {
                // Pipeline complete and nothing more queued -> idle.
                isPlayingQueue = false;
                videoPoster.classList.remove('hidden');
                frontPlayer().classList.remove('is-front');
                thinkingIndicator.classList.remove('active');
                return;
            }

            if (videoQueue.length > 0) {
                // Pop the chunk that's (hopefully) loaded into the back player.
                const expected = videoQueue.shift();
                const versioned = expected + '?v=';
                if (!playerSrc[backIdx].startsWith(versioned)) {
                    // Back player wasn't preloaded with this chunk yet; load now.
                    // (Happens when the next chunk arrived right as the previous ended.)
                    loadIntoBack(expected);
                }
                swapToBack();
                // Pre-load the chunk after this one if available.
                if (videoQueue.length > 0) {
                    loadIntoBack(videoQueue[0]);
                }
            } else {
                // Queue empty but pipeline still running: linger on the last frame.
                // Don't drop is-front; the still image of the last frame is shown.
                console.log('Queue empty, waiting for more chunks...');
            }
        }

        // Wire up the two players once. Their src changes per chunk but listeners
        // stay the same.
        for (let i = 0; i < players.length; i++) {
            const idx = i;
            const el = players[idx];

            el.addEventListener('canplaythrough', () => {
                playerLoaded[idx] = true;
            });

            el.addEventListener('loadedmetadata', () => {
                setAspectRatioFromVideo(el);
            });

            el.addEventListener('play', () => {
                if (idx !== frontIdx) return;
                if (!firstVideoStarted) {
                    firstVideoStarted = true;
                    thinkingIndicator.classList.remove('active');
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                    micBtn.disabled = false;
                }
            });

            el.addEventListener('ended', () => {
                if (idx !== frontIdx) return;
                onChunkEnded();
            });

            el.addEventListener('error', (e) => {
                console.error(`Video player ${idx} error:`, el.error, e);
            });
        }

        function startEventStream(pipelineId) {
            currentPipelineId = pipelineId;

            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }

            eventSource = new EventSource(`/stream_events?pipeline_id=${pipelineId}`);

            eventSource.onmessage = (ev) => {
                let data;
                try { data = JSON.parse(ev.data); }
                catch (e) { console.warn('Bad SSE payload:', ev.data); return; }

                if (data.status === 'READY') {
                    videoQueue.push(data.video_url);
                    console.log(`Chunk received: ${data.video_url}, queue=${videoQueue.length}`);
                    maybeStartNextChunk();
                } else if (data.status === 'DONE') {
                    console.log('Pipeline complete. Remaining queue:', videoQueue.length);
                    if (eventSource) { eventSource.close(); eventSource = null; }
                    // If nothing is playing and queue empty, mark idle now;
                    // otherwise the `ended` handler will return us to idle when
                    // the last chunk finishes.
                    if (videoQueue.length === 0 && !isPlayingQueue) {
                        currentPipelineId = null;
                        videoPoster.classList.remove('hidden');
                        thinkingIndicator.classList.remove('active');
                    } else {
                        // Allow `ended` handler to clean up after final chunk.
                        currentPipelineId = null;
                    }
                } else if (data.status === 'ERROR') {
                    console.error('Pipeline error:', data.error);
                    showError(chatError, data.error || 'Generation failed');
                    if (eventSource) { eventSource.close(); eventSource = null; }
                    currentPipelineId = null;
                    chatInput.disabled = false;
                    sendBtn.disabled = false;
                    micBtn.disabled = false;
                    thinkingIndicator.classList.remove('active');
                }
                // status === 'WAIT' is just a keepalive ping; ignore.
            };

            eventSource.onerror = (err) => {
                console.error('SSE connection error:', err);
                // EventSource auto-reconnects per the `retry:` field; nothing else to do.
            };
        }

        function cleanupPreviousQuestion() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            for (const el of players) {
                el.pause();
                el.removeAttribute('src');
                el.load();
                el.classList.remove('is-front');
            }
            playerLoaded[0] = playerLoaded[1] = false;
            playerSrc[0] = playerSrc[1] = '';
            frontIdx = 0;
            backIdx = 1;
            videoQueue = [];
            isPlayingQueue = false;
            currentPipelineId = null;
            firstVideoStarted = false;
            videoPoster.classList.remove('hidden');
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text || sendBtn.disabled) {
                return;
            }

            // Clean up any previous question's state
            cleanupPreviousQuestion();

            // Disable input and show thinking indicator
            chatInput.disabled = true;
            sendBtn.disabled = true;
            thinkingIndicator.classList.add('active');
            chatError.classList.remove('active');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Generation failed');
                }

                // Clear input
                chatInput.value = '';

                // Open SSE stream for chunks
                startEventStream(data.pipeline_id);

            } catch (error) {
                showError(chatError, error.message || 'Failed to generate response. Please try again.');
                chatInput.disabled = false;
                sendBtn.disabled = false;
                thinkingIndicator.classList.remove('active');
            }
        }
    </script>
</body>
